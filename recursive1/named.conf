options {
    directory "recursive1";
    pid-file "named.pid";
    session-keyfile "session.key";

    listen-on { 172.30.0.100; };
    listen-on-v6 { none; };

    recursion yes;

    allow-recursion {
        172.30.0.0/24;
    };

    allow-query {
        172.30.0.0/24;
    };

    dnssec-validation no;

    query-source address 172.30.0.100;
    qname-minimization off;
};

zone "." {
    type hint;
    file "zones/db.root.hints";
};
