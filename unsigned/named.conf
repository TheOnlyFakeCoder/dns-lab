options {
    directory "unsigned";
    pid-file "named.pid";
    session-keyfile "session.key";

    listen-on { 172.30.0.20; };
    listen-on-v6 { none; };

    recursion no;
    dnssec-validation no;
    allow-query { any; };
};

zone "unsigned" {
    type primary;
    file "zones/db.unsigned";
};
