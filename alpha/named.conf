options {
    directory "alpha";
    pid-file "named.pid";
    session-keyfile "session.key";

    listen-on { 172.30.0.30; };
    listen-on-v6 { none; };

    recursion no;
    dnssec-validation no;
    allow-query { any; };
};

zone "alpha.unsigned" {
    type primary;
    file "zones/db.alpha.unsigned";
};
